<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
 <title>Triagem Hospitalar</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  .btn-tv {
    background-color: greenyellow;
    color: white;
    border: none;
    padding: 8px 14px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 14px;
    margin-left: 8px;

  }

  .btn-tv:hover{
    background-color: #1e7e342f;
  }

  .paciente-fila{
    margin-bottom: 30px;
    background: #f0f4ff;
    border-radius: 8px;
    padding: 16px;
    border: 1px solid #d0d8f0;

  }

  .paciente-fila h3{
    margin-top: 0;
    color: #333;
    display: flex;
justify-content: space-between;
align-items: center;
  }

  .paciente-fila h3 span{
font-size: 13px;
font-weight: normal;
color: #666;

  }

  .fila-item{
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: white;
    border-radius: 8px;
    padding: 10px 14px;
    margin-bottom: 8px;
    border: 1px solid white;
  }

  .fila-item strong { font-size: 15px;}
  .fila-item small{ color: #888;
  font-size: 12px;}

  .btn-abrir-tv{
    display: inline-block;
    background: #17a2b8;
    color: white;
    padding: 8px 14px;
    border-radius: 5px;
    font-size: 14px;
    text-decoration:none;
    cursor: pointer;
    border: none;
  }

  .btn-abrir-tv:hover{
    background: #17a2b8;
    
  }

 </style>

</head>


<body>

  <div class="container">

    <!-- cabeçalho com botão da TV-->
     <div style="display:flex; justify-content:space-between; align-items:center; margin-top: 20px;">
      <h2 style="margin:0">🏥 Triagem Hospitalar</h2>
      <button class="btn-abrir-tv" onclick="window.open('tv.html','_blank')">📺 Abrir Tela da TV</button>
     </div>

     <!--fila de pacientes do atendimento criada para mostrar quem pode ser chmado na tv-->
       <div class="paciente-fila">
        <h3>Pacientes Cadastrados no Atendimentos
          <span>Clique em "Chamar na TV" para chamar ao guichê</span>
        </h3>
        <div id="fila-pacientes">
          <p style="color: #888; text-align: center;">Carregando...</p>
        </div>
        <button onclick="carregarPacientes()"
        style="margin-top: 8px;
        background: #6c757d; color: white;
        border: none; padding: 6px 12px; 
        border-radius: 4px; cursor: pointer;
        font-size: 13px;">🔁</button>
       </div>
    <h2>🏥 Triagem Hospitalar</h2>


    <input
      id="nome"
      placeholder="Nome"
    >


    <select id="sintoma">

      <option value="">
        Selecione o sintoma
      </option>

      <option value="dor_leve">
        Dor leve
      </option>

      <option value="resfriado">
        Resfriado
      </option>

      <option value="coriza">
        Coriza
      </option>

      <option value="tosse">
        Tosse
      </option>

      <option value="febre">
        Febre
      </option>

      <option value="vomito">
        Vômito
      </option>

      <option value="diarreia">
        Diarreia
      </option>

      <option value="falta_ar_moderada">
        Falta de ar moderada
      </option>

      <option value="falta_ar_grave">
        Falta de ar grave
      </option>

      <option value="infarto">
        Suspeita de infarto
      </option>

      <option value="avc">
        Suspeita de AVC
      </option>

      <option value="convulsao">
        Convulsão
      </option>

      <option value="hemorragia">
        Hemorragia
      </option>

    </select>


    <input
      id="temp"
      type="number"
      step="0.1"
      placeholder="Temperatura °C"
    >


    <input
      id="alergia"
      placeholder="Alergias"
    >


    <textarea
      id="observacao"
      placeholder="Observações"
    ></textarea>


    <div id="resultado"></div>


    <button onclick="salvar()">
      Salvar Triagem
    </button>

  </div>


  <script>

    function classificarRisco(sintoma, temperatura) {

      const vermelhos = [
        "infarto",
        "avc",
        "convulsao",
        "hemorragia",
        "falta_ar_grave"
      ];


      const amarelos = [
        "febre",
        "vomito",
        "diarreia",
        "falta_ar_moderada"
      ];


      if (temperatura >= 39) {
        return "vermelho";
      }


      if (vermelhos.includes(sintoma)) {
        return "vermelho";
      }


      if (amarelos.includes(sintoma)) {
        return "amarelo";
      }


      return "verde";
    }


    function salvar() {

      const nome =
        document.getElementById("nome").value;

      const sintoma =
        document.getElementById("sintoma").value;

      const temperatura =
        Number(
          document.getElementById("temp").value
        );

      const alergia =
        document.getElementById("alergia").value;

      const observacao =
        document.getElementById("observacao").value;


      /* Validação */

      if (!nome.trim()) {

        alert("Digite o nome do paciente.");

        return;
      }


      if (!sintoma) {

        alert("Selecione um sintoma.");

        return;
      }


      if (!temperatura) {

        alert("Informe a temperatura.");

        return;
      }


      /* Classificação */

      const risco =
        classificarRisco(
          sintoma,
          temperatura
        );


      /* Enviar para a API */

      fetch("http://localhost:3000/triagem", {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({

          nome,
          sintoma,
          temperatura,
          alergia,
          observacao,
          risco

        })

      })


      .then(r => r.json())


      .then(data => {

        const resultado =
          document.getElementById("resultado");


        resultado.className = risco;


        resultado.innerHTML =
          "Classificação: " +
          risco.toUpperCase();


        alert("Triagem salva!");

      })


      .catch(error => {

        console.error(error);

        alert(
          "Erro ao salvar a triagem. " +
          "Verifique se o servidor está funcionando."
        );

      });

    }

  </script>

</body>

</html>
