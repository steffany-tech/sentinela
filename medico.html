<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Médico</title>

  <style>
    /* ==============================
       CONFIGURAÇÕES GERAIS
    ============================== */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #e5e5e5;
      color: #111;
      min-height: 100vh;
      padding: 30px 15px;
    }

    /* ==============================
       CONTAINER PRINCIPAL
    ============================== */

    .container {
      width: 100%;
      max-width: 950px;
      margin: auto;
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
    }

    /* ==============================
       TÍTULOS
    ============================== */

    h2 {
      background: #111111;
      color: #ffffff;
      padding: 18px;
      border-radius: 8px;
      text-align: center;
      margin-bottom: 25px;
      font-size: 26px;
    }

    h3 {
      margin-bottom: 15px;
      color: #222222;
    }

    hr {
      border: none;
      border-top: 2px solid #d0d0d0;
      margin: 30px 0;
    }

    /* ==============================
       CARDS DAS TRIAGENS
    ============================== */

    #triagens {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }

    .card {
      background: #f5f5f5;
      border: 1px solid #cccccc;
      border-radius: 10px;
      padding: 20px;
      transition: 0.3s;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.12);
      border-color: #888888;
    }

    .card h3 {
      background: #222222;
      color: #ffffff;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 15px;
    }

    .card p {
      margin-bottom: 10px;
      line-height: 1.5;
      color: #333333;
    }

    /* ==============================
       CLASSIFICAÇÃO DE RISCO
    ============================== */

    .verde,
    .amarelo,
    .vermelho {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 20px;
      font-weight: bold;
      text-transform: uppercase;
      font-size: 12px;
    }

    /* Todas usando apenas cinza, branco e preto */

    .verde {
      background: #d9d9d9;
      color: #222222;
      border: 1px solid #999999;
    }

    .amarelo {
      background: #999999;
      color: #ffffff;
    }

    .vermelho {
      background: #111111;
      color: #ffffff;
    }

    /* ==============================
       FORMULÁRIO
    ============================== */

    input,
    select,
    textarea {
      width: 100%;
      padding: 13px 15px;
      margin-bottom: 15px;
      border: 1px solid #bbbbbb;
      border-radius: 7px;
      background: #ffffff;
      color: #111111;
      font-size: 15px;
      outline: none;
      transition: 0.2s;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #111111;
      box-shadow: 0 0 0 2px #dddddd;
    }

    input[readonly] {
      background: #eeeeee;
      color: #555555;
      font-weight: bold;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    /* ==============================
       BOTÕES
    ============================== */

    button {
      border: none;
      border-radius: 7px;
      padding: 12px 20px;
      background: #111111;
      color: #ffffff;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #555555;
      transform: translateY(-1px);
    }

    .card button {
      width: 100%;
      margin-top: 10px;
      background: #333333;
    }

    .card button:hover {
      background: #111111;
    }

    /* ==============================
       ÁREA DE CONSULTA
    ============================== */

    #paciente {
      border-left: 5px solid #111111;
    }

    #diagnostico {
      border-left: 5px solid #555555;
    }

    #medicacao {
      border-left: 5px solid #888888;
    }

    #obs {
      border-left: 5px solid #aaaaaa;
    }

    /* ==============================
       RESPONSIVIDADE
    ============================== */

    @media (max-width: 600px) {

      body {
        padding: 15px 10px;
      }

      .container {
        padding: 20px 15px;
      }

      h2 {
        font-size: 21px;
      }

      #triagens {
        grid-template-columns: 1fr;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h2>🩺 Painel Médico</h2>

    <div id="triagens"></div>

    <hr>

    <h3>Consulta</h3>

    <input id="paciente" placeholder="Paciente" readonly>

    <input id="diagnostico" placeholder="Diagnóstico">

    <select id="medicacao">
      <option value="">Selecione a medicação</option>
    </select>

    <textarea id="obs" placeholder="Observações"></textarea>

    <button onclick="salvar()">Salvar</button>

  </div>

  <script>

    let triagensCarregadas = [];

    function carregar() {
      fetch("/triagens")
        .then(r => r.json())
        .then(data => {

          triagensCarregadas = data;

          const div = document.getElementById("triagens");
          div.innerHTML = "";

          data.forEach((t, index) => {

            div.innerHTML += `
              <div class="card">

                <h3>${t.nome}</h3>

                <p>
                  <b>Sintoma:</b>
                  ${t.sintoma || "Não informado"}
                </p>

                <p>
                  <b>Temperatura:</b>
                  ${t.temperatura || "Não informada"}°C
                </p>

                <p>
                  <span class="${t.risco}">
                    ${t.risco}
                  </span>
                </p>

                <p>
                  <b>Alergia:</b>
                  ${t.alergia || "Nenhuma"}
                </p>

                <p>
                  <b>Observação:</b>
                  ${t.observacao || "Nenhuma"}
                </p>

                <button onclick="selecionar(${index})">
                  Atender
                </button>

              </div>
            `;
          });
        });
    }

    function selecionar(index) {

      const t = triagensCarregadas[index];

      document.getElementById("paciente").value = t.nome;

      document.getElementById("obs").value =
        t.observacao || "";

      if (t.alergia && t.alergia !== "Nenhuma") {

        alert(
          "⚠️ Paciente possui alergia: " +
          t.alergia
        );

      }
    }

    function carregarMedicacoes() {

      fetch("/lista-medicacoes")
        .then(r => r.json())
        .then(data => {

          const select =
            document.getElementById("medicacao");

          select.innerHTML = `
            <option value="">
              Selecione a medicação
            </option>
          `;

          data.forEach(med => {

            const option =
              document.createElement("option");

            option.value = med;
            option.textContent = med;

            select.appendChild(option);
          });

        });
    }

    function salvar() {

      const paciente =
        document.getElementById("paciente").value;

      const diagnostico =
        document.getElementById("diagnostico").value;

      const medicacao =
        document.getElementById("medicacao").value;

      const obs =
        document.getElementById("obs").value;

      if (!paciente) {

        alert(
          "Selecione um paciente clicando em Atender."
        );

        return;
      }

      if (!medicacao) {

        alert("Selecione uma medicação.");

        return;
      }

      fetch("/consulta", {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          paciente,
          diagnostico,
          medicacao,
          obs
        })

      })

      .then(r => r.json())

      .then(() => {

        alert("Consulta salva");

        document.getElementById("diagnostico").value = "";

        document.getElementById("medicacao").value = "";

        document.getElementById("obs").value = "";

      });

    }

    carregar();
    carregarMedicacoes();

  </script>

</body>

</html>
